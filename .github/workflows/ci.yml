name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund 2>&1 | tee install.log
      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee test.log
      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint.log
      - name: Run build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log
      - name: Check agent server syntax
        id: syntax
        continue-on-error: true
        run: node --check server/index.js 2>&1 | tee server-syntax.log
      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            install.log
            test.log
            lint.log
            build.log
            server-syntax.log
      - name: Fail when validation failed
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.syntax.outcome }}" = "success"
